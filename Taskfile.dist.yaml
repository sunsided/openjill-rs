version: '3'

dotenv: ['.env']

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  clean:
    desc: Remove cargo build artifacts
    cmds:
      - cargo clean

  fmt:
    desc: Format all Rust sources
    cmds:
      - cargo fmt --all

  fmt:check:
    desc: Check formatting without modifying files
    cmds:
      - cargo fmt --all -- --check

  lint:
    desc: Run clippy across the workspace (warnings as errors)
    aliases:
      - lint:check
    cmds:
      - cargo clippy --workspace --all-targets --all-features -- -D warnings

  lint:fix:
    desc: Auto-fix clippy lints, then format and build
    cmds:
      - cargo clippy --workspace --all-targets --all-features --fix --allow-dirty --allow-staged
      - task: fmt

  check:
    desc: Type-check the workspace without producing binaries
    cmds:
      - cargo check --workspace --all-targets
      - task: fmt:check

  build:
    desc: Build the workspace (debug profile)
    cmds:
      - cargo build --workspace --all-targets

  build:release:
    desc: Build the workspace (release profile)
    cmds:
      - cargo build --workspace --release

  test:
    desc: Run the workspace test suite
    cmds:
      - cargo test --workspace --all-targets

  test:doc:
    desc: Run doctests
    cmds:
      - cargo test --workspace --doc

  doc:
    desc: Build rustdoc for the workspace
    cmds:
      - cargo doc --workspace --no-deps

  doc:open:
    desc: Build and open rustdoc in browser
    cmds:
      - cargo doc --workspace --no-deps --open

  run:
    desc: Run the default binary (pass args via -- arg1 arg2)
    cmds:
      - cargo run --bin openjill -- run {{.CLI_ARGS}}

  ci:
    desc: Run the checks expected in CI (fmt, lint, test)
    cmds:
      - task: fmt:check
      - task: lint
      - task: test

  data:verify:
    desc: Verify original episode 1 data (uses DATA_DIR, OPENJILL_DATA_DIR, or data/original/JILL1)
    cmds:
      - task: data:run
        vars:
          COMMAND: data verify

  data:dump:
    desc: Dump original episode 1 data (uses DATA_DIR, OPENJILL_DATA_DIR, or data/original/JILL1; pass args via --)
    cmds:
      - task: data:run
        vars:
          COMMAND: dump

  data:sha:extract:
    desc: Render JILL1.SHA tilesets to PNG (DATA_DIR/OPENJILL_DATA_DIR/data/original/JILL1; pass flags via --)
    vars:
      DATA_DIR: '{{.DATA_DIR | default .OPENJILL_DATA_DIR | default "data/original/JILL1"}}'
    cmds:
      - cargo run -p openjill-sha-extract -- --file {{.DATA_DIR}}/JILL1.SHA {{.CLI_ARGS}}

  data:sha:edit:
    desc: Open the read-only SHA viewer GUI (DATA_DIR/OPENJILL_DATA_DIR/data/original/JILL1; pass flags via --)
    vars:
      DATA_DIR: '{{.DATA_DIR | default .OPENJILL_DATA_DIR | default "data/original/JILL1"}}'
    cmds:
      - cargo run -p openjill-sha-edit -- --file {{.DATA_DIR}}/JILL1.SHA {{.CLI_ARGS}}

  data:jn:extract:
    desc: Render a JN map to PNG (DATA_DIR/OPENJILL_DATA_DIR/data/original/JILL1, JN defaults to 1.JN1; pass flags via --)
    vars:
      DATA_DIR: '{{.DATA_DIR | default .OPENJILL_DATA_DIR | default "data/original/JILL1"}}'
      JN: '{{.JN | default "1.JN1"}}'
    cmds:
      - cargo run -p openjill-jn-extract -- --file {{.DATA_DIR}}/{{.JN}} {{.CLI_ARGS}}

  data:jn:view:
    desc: Open the read-only JN level viewer GUI (DATA_DIR/OPENJILL_DATA_DIR/data/original/JILL1, JN defaults to 1.JN1; pass flags via --)
    vars:
      DATA_DIR: '{{.DATA_DIR | default .OPENJILL_DATA_DIR | default "data/original/JILL1"}}'
      JN: '{{.JN | default "1.JN1"}}'
    cmds:
      - cargo run -p openjill-jn-view -- --file {{.DATA_DIR}}/{{.JN}} {{.CLI_ARGS}}

  data:run:
    internal: true
    env:
      DATA_DIR: '{{.DATA_DIR | default ""}}'
    cmds:
      - |
        if [ -z "$DATA_DIR" ] && [ -z "$OPENJILL_DATA_DIR" ] && [ ! -d data/original/JILL1 ]; then
          task binary:fetch
        fi
        cargo run -p openjill-cli --bin openjill -- {{.COMMAND}} {{.CLI_ARGS}}

  data:clean:
    desc: Remove downloaded ZIP and extracted data under data/
    cmds:
      - rm -rf data/original
      - rm -f data/jill-of-the-jungle.zip

  binary:fetch:
    desc: Download Jill of the Jungle ZIP and unpack it into data/original
    deps: [data:clean]
    requires:
      vars: [ZIP_LINK, ZIP_PASS]
    preconditions:
      - sh: command -v 7z
        msg: "7z not found in PATH. Install p7zip-full (e.g. apt install p7zip-full)."
    vars:
      DEST_DIR: data/original
      ZIP_FILE: data/jill-of-the-jungle.zip
    cmds:
      - mkdir -p {{.DEST_DIR}} data
      - curl -fL --retry 3 -o {{.ZIP_FILE}} "$ZIP_LINK"
      - |
        tmp=$(mktemp -d)
        7z x -y -p"$ZIP_PASS" -o"$tmp" {{.ZIP_FILE}}
        inner=$(find "$tmp" -mindepth 1 -maxdepth 1)
        if [ "$(echo "$inner" | wc -l)" -eq 1 ] && [ -d "$inner" ]; then
          cp -a "$inner"/. {{.DEST_DIR}}/
        else
          cp -a "$tmp"/. {{.DEST_DIR}}/
        fi
        rm -rf "$tmp"
      - rm -f {{.ZIP_FILE}}
