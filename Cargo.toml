[workspace]
members = [
    "crates/openjill-data",
    "crates/openjill-core",
    "crates/openjill-game",
    "crates/openjill-render",
    "crates/openjill-audio",
    "crates/openjill-cli",
    "tools/openjill-dump",
]
resolver = "3"

[workspace.package]
authors = ["OpenJill contributors"]
edition = "2024"
license = "MPL-2.0"
rust-version = "1.95"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.100"
assert2 = "0.4.0"
bytemuck = { version = "1.24.0", features = ["derive"] }
clap = { version = "4.5.51", features = ["derive"] }
pollster = "0.4.0"
png = "0.18.1"
serde_json = "1.0.149"
sha2 = "0.10.9"
thiserror = "2.0.17"
wgpu = "24.0.5"
winit = "0.30.12"
