name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - main
      - 'feature/**'
      - 'copilot/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    env:
      ZIP_LINK: ${{ secrets.ZIP_LINK }}
      ZIP_PASS: ${{ secrets.ZIP_PASS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install audio build dependencies (ALSA)
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Install Task runner
        if: env.ZIP_LINK != '' && env.ZIP_PASS != ''
        uses: arduino/setup-task@v2

      - name: Install 7z for data extraction
        if: env.ZIP_LINK != '' && env.ZIP_PASS != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Fetch original Jill data
        if: env.ZIP_LINK != '' && env.ZIP_PASS != ''
        run: task -t Taskfile.dist.yaml binary:fetch

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: cargo test (workspace)
        env:
          OPENJILL_DATA_DIR: ${{ github.workspace }}/data/original/JILL1
        run: cargo test --workspace --all-targets --locked

  dependencies:
    name: Dependency Submission
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-sbom
        uses: psastras/sbom-rs/actions/install-cargo-sbom@cargo-sbom-v0.10.0

      - name: Generate SBOM
        run: cargo-sbom --output-format=spdx_json_2_3 > sbom.json

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.json

      - name: Submit dependencies to GitHub
        uses: advanced-security/spdx-dependency-submission-action@v0.2.0
        with:
          filePath: sbom.json
